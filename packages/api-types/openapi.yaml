  /api/v1/academic/assessments/{assessment_id}/grades/:
    put:
      operationId: academic_assessments_grades_update
      description: |-
        Record every mark for one assessment in a single call.

        Marking is done a column at a time -- a teacher sits with one exam and goes
        down the list -- so the endpoint matches the act. One request per cell would
        also make a half-saved column the normal outcome of a dropped connection;
        this way the column lands or it does not.
      summary: Record marks for an assessment
      parameters:
      - in: path
        name: assessment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academic
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GradeInputRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GradeInputRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GradeInputRequest'
        required: true
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
          description: ''
