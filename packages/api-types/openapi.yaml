components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 64
        start_date:
          type: string
          format: date
          title: Fecha de inicio
        end_date:
          type: string
          format: date
          title: Fecha de fin
        is_current:
          type: boolean
          title: Actual
          description: Solo un año académico debe estar activo a la vez.
        is_active:
          type: boolean
          readOnly: true
          title: Activo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado el
      required:
      - created_at
      - end_date
      - id
      - is_active
      - name
      - start_date
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
