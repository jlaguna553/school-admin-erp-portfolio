  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Exchanges credentials for an access token.

        One hostname serves every institution, so the school is not resolved from the request: the credential is looked up platform-wide and the response says which schools the account is registered at. The session opens at the one used last, and `schools` lists them all -- a client with one entry renders no switcher, but still knows where it is. It is empty only for a platform operator, who is above every school.

        The **refresh token is returned as an httpOnly cookie**, not in the body, so JavaScript cannot read it. Set `AUTH_REFRESH_IN_BODY=True` to also include it for native clients that cannot use cookies.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the refresh token so it cannot be replayed, and clears
        the httpOnly cookie. The token is taken from the body if supplied, otherwise
        from the cookie.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - tenantJwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Reads the refresh token from the request body if present, otherwise
        from the httpOnly cookie set at login. Rotation is enabled, so a new cookie
        is issued on every call and the previous token is blacklisted.
      summary: Refresh the access token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: A new access token.
  /api/v1/auth/schools/:
    get:
      operationId: auth_schools_list
      description: Every school the caller may work at, current one included. Empty
        for a platform operator. Each entry carries the school's currency and brand
        colour so the client can repaint immediately after switching, without a second
        round trip.
      summary: Schools the signed-in person can reach
      tags:
      - auth
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSchool'
          description: ''
  /api/v1/auth/switch/:
    post:
      operationId: auth_switch_create
      description: |-
        Re-issue the session against a different school.

        Under the old host-per-school model this was a navigation to another origin,
        which meant signing in again -- the refresh cookie is host-only. On one
        domain the session stays where it is and only the tenant claim changes, so
        switching costs a round trip instead of a password.

        The membership is re-read here rather than trusted from the list the client
        was handed at login: that list may be minutes old, and access can be revoked
        in between.
      summary: Switch to another of your schools
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchSchoolRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwitchSchoolRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwitchSchoolRequest'
        required: true
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          description: A token scoped to the chosen school.
  /api/v1/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      summary: Verify a token
      tags:
      - auth
      requestBody:
