openapi: 3.0.3
info:
  title: School Administration ERP API
  version: 0.1.0
  description: Multi-tenant, internationalized ERP for educational institutions. Each
    school is isolated in its own Postgres schema and resolved from the request host.
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: |-
        Unauthenticated liveness probe that also reports tenant resolution.

        Useful during onboarding: hitting it on a school's host confirms the domain
        is mapped to the right Postgres schema before any real request is made.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ResolvedTenant:
                  value:
                    status: ok
                    schema: northfield
                    language: es
                    available_languages:
                    - es
                    - en
                  summary: Resolved tenant
          description: ''
  /api/v1/academic/academic-years/:
    get:
      operationId: academic_academic_years_list
      description: |-
        ``ModelViewSet`` whose ``DELETE`` deactivates the record (rule A.3).

        ``BaseModel.delete()`` is already a soft delete, so ``perform_destroy`` needs
        no override -- but it is spelled out here so the behaviour is discoverable
        at the API layer rather than only in the model.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_current
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - academic
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
    post:
      operationId: academic_academic_years_create
      description: |-
        ``ModelViewSet`` whose ``DELETE`` deactivates the record (rule A.3).

        ``BaseModel.delete()`` is already a soft delete, so ``perform_destroy`` needs
        no override -- but it is spelled out here so the behaviour is discoverable
        at the API layer rather than only in the model.
