        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          title: Rol
          enum:
          - accountant
          - coordinator
          - guardian
          - platform_admin
          - school_admin
          - student
          - teacher
        description: |-
          * `platform_admin` - Administrador de la plataforma
          * `school_admin` - Administrador del colegio
          * `coordinator` - Coordinador académico
          * `teacher` - Docente
          * `student` - Estudiante
          * `guardian` - Tutor
          * `accountant` - Contador
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - tenants
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
