          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Estado
          enum:
          - active
          - completed
          - pending
          - withdrawn
        description: |-
          * `pending` - Pendiente
          * `active` - Activa
          * `withdrawn` - Retirada
          * `completed` - Completada
      - in: query
        name: student
        schema:
          type: string
          format: uuid
      tags:
