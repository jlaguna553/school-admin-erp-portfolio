  /api/v1/academic/attendance/weekly/:
    get:
      operationId: academic_attendance_weekly_list
      description: 'A trailing window ending today. ``recorded`` is how many marks
        the percentage rests on: a day with none is a day nobody took a roll, not
        a day of zero attendance.'
      summary: Daily attendance rate
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Default 7, max 90.
      tags:
      - academic
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendancePoint'
          description: ''
  /api/v1/academic/classes/today/:
    get:
      operationId: academic_classes_today_list
      description: |-
        The classes on one date, with whether the roll has been taken.

        The entry point to attendance: a teacher opens the day and sees what they
        are teaching and what is still unrecorded. Two questions in one call,
        because the second one -- "have I done this yet" -- is the whole reason for
        the screen, and asking it per class would be one request per row.
      summary: Classes on a date, and their registers
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Defaults to today.
      - in: query
        name: group
        schema:
          type: string
      - in: query
        name: teacher
        schema:
          type: string
      tags:
      - academic
      security:
      - tenantJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Roll'
          description: ''
