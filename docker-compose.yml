# Development stack: `docker compose up`
#
# Ports are configurable because 3000/5432/8000 are commonly already taken:
#   WEB_PORT=3002 API_PORT=8001 docker compose up

# Explicit project name. Without it both compose files default to the directory
# name, share one network, and `down -v` on either stack tears down the other.
name: school-admin-erp

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    container_name: erp_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-docker-dev-key}
      DJANGO_DEBUG: "True"
      # `.localhost` covers every school subdomain; `api` is the in-network name.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,.localhost,api,0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@db:5432/${POSTGRES_DB:-erp}
      DATABASE_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      PUBLIC_DOMAIN: localhost
      # The platform operator, created on boot. Present in the dev stack so the
      # console is reachable out of the box and its end-to-end tests have an
      # account to sign in with. Deployments set their own.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@platform.test}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-Platform!2026dev}
      # The frontend proxies /api in deployment, so Django trusts the
      # forwarded host for ALLOWED_HOSTS checks. It no longer selects a tenant.
      DJANGO_USE_X_FORWARDED_HOST: "True"
      # No TLS in the dev stack, so the refresh cookie cannot be Secure-only.
      AUTH_COOKIE_SECURE: "False"
      # Relaxed for the end-to-end suite, which logs in on every test (a saved
      # session cannot be reused: refresh tokens rotate and blacklist their
      # predecessor). Production keeps the strict defaults from base.py, and
      # the throttles themselves are covered by the pytest suite.
      THROTTLE_LOGIN: ${THROTTLE_LOGIN:-1000/min}
      THROTTLE_LOGIN_EMAIL: ${THROTTLE_LOGIN_EMAIL:-1000/min}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source is mounted for hot reload. `.venv` is masked by an anonymous
      # volume so a host virtualenv never shadows the container's packages.
      - ./apps/api:/app
      - /app/.venv
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    container_name: erp_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # One hostname serves the whole platform: reach the app at
      # localhost:3000. The school is chosen by the session, not the host. The
      # API is a separate service on that same hostname during development,
      # which is same-site (cookies ignore ports) so the refresh cookie travels.
      NEXT_PUBLIC_API_PORT: ${API_PORT:-8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Only source directories are mounted. Mounting the whole workspace would
      # shadow the image's node_modules and break module resolution.
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
      - ./packages/api-types/src:/repo/packages/api-types/src

volumes:
  erp_pgdata:
